name: AEFH v5.0 numerical tests

on:
  push:
    branches: [main]
    paths:
      - "aefh/v5/**"
      - ".github/workflows/aefh-v5.yml"
  pull_request:
    paths:
      - "aefh/v5/**"
      - ".github/workflows/aefh-v5.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install NumPy
        run: python -m pip install --upgrade numpy
      - name: Run numerical tests
        run: python aefh/v5/aefh_v5_higgs_u1_tests.py -v
      - name: Run tests with optimizations enabled
        run: python -O aefh/v5/aefh_v5_higgs_u1_tests.py -v
