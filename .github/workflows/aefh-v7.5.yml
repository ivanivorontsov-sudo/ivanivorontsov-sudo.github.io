name: AEFH v7.5 full manuscript numerical checks

on:
  push:
    branches: [main]
    paths:
      - "aefh/v7.5/**"
      - "aefh/v7/aefh_v7_rg_tests.py"
      - ".github/workflows/aefh-v7.5.yml"
  pull_request:
    paths:
      - "aefh/v7.5/**"
      - "aefh/v7/aefh_v7_rg_tests.py"
      - ".github/workflows/aefh-v7.5.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  master-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install NumPy and SymPy
        run: python -m pip install --upgrade numpy sympy
      - name: Run 22 master tests
        run: python3 aefh/v7.5/aefh_v7_5_master_tests.py -v
      - name: Run 22 master tests with optimizations
        run: python3 -O aefh/v7.5/aefh_v7_5_master_tests.py -v
      - name: Run 6 RG tests
        run: python3 aefh/v7/aefh_v7_rg_tests.py -v
      - name: Run 6 RG tests with optimizations
        run: python3 -O aefh/v7/aefh_v7_rg_tests.py -v
