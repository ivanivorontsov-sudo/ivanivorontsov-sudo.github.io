name: AEFH v7.0 RG numerical checks

on:
  push:
    branches: [main]
    paths:
      - "aefh/v7/**"
      - ".github/workflows/aefh-v7.yml"
  pull_request:
    paths:
      - "aefh/v7/**"
      - ".github/workflows/aefh-v7.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rg-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run numerical tests
        run: python aefh/v7/aefh_v7_rg_tests.py -v
      - name: Run with optimizations enabled
        run: python -O aefh/v7/aefh_v7_rg_tests.py -v
