name: AEFH v7.0 master numerical checks

on:
  push:
    branches: [main]
    paths:
      - "aefh/v7/**"
      - ".github/workflows/aefh-v7.yml"
  pull_request:
    paths:
      - "aefh/v7/**"
      - ".github/workflows/aefh-v7.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  master-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install NumPy
        run: python -m pip install --upgrade numpy
      - name: Run the existing RG checks
        run: python3 aefh/v7/aefh_v7_rg_tests.py -v
      - name: Run the existing RG checks with optimizations
        run: python3 -O aefh/v7/aefh_v7_rg_tests.py -v
      - name: Run the 20-test master suite
        run: python3 aefh/v7/aefh_v7_master_tests.py -v
      - name: Run the 20-test master suite with optimizations enabled
        run: python3 -O aefh/v7/aefh_v7_master_tests.py -v
