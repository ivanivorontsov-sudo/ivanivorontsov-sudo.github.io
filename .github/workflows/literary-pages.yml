name: Build literary pages

on:
  push:
    branches: [main]
    paths:
      - "proizvedeniya/content/works/**"
      - "ii-proizvedeniya/content/works/**"
      - "proizvedeniya/index.html"
      - "ii-proizvedeniya/index.html"
      - "scripts/build-literary-sites.mjs"
      - ".github/workflows/literary-pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: literary-pages-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate static pages and sitemap
        run: node scripts/build-literary-sites.mjs
      - name: Commit generated HTML
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A sitemap.xml proizvedeniya/index.html ii-proizvedeniya/index.html proizvedeniya/works ii-proizvedeniya/works
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "Build literary pages [skip ci]"
            git push
          fi
