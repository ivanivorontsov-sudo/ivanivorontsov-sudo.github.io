name: SEO audit

on:
  push:
    branches: [main]
    paths:
      - "**/*.html"
      - "**/*.js"
      - "**/*.mjs"
      - "**/*.css"
      - "**/*.svg"
      - "**/*.webmanifest"
      - "sitemap.xml"
      - "robots.txt"
      - "scripts/**"
      - ".github/workflows/seo-audit.yml"
  pull_request:
    branches: [main]
    paths:
      - "**/*.html"
      - "**/*.js"
      - "**/*.mjs"
      - "**/*.css"
      - "**/*.svg"
      - "**/*.webmanifest"
      - "sitemap.xml"
      - "robots.txt"
      - "scripts/**"
      - ".github/workflows/seo-audit.yml"

permissions:
  contents: read

jobs:
  seo-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify generated sitemap
        run: python scripts/generate_sitemap.py --check
      - name: Validate SEO, metadata, links and sitemap
        run: python scripts/seo_audit.py
      - name: Verify the 1000-tool workshop inventory
        run: python scripts/check_workshop.py
      - name: Parse local converter engine
        run: node --check tools-audit/workshop/converters.js
      - name: Parse smart search engine
        run: node --check tools-audit/search.js
      - name: Validate Drive Horizon runtime and vehicle
        run: node scripts/check_drive_game.mjs
      - name: Parse inline JavaScript
        run: node scripts/check_inline_js.mjs
      - name: Check local browser utilities bundle
        run: node --check tools-audit/web-tools.js
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run browser smoke audit
        run: |
          set -Eeuo pipefail
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/site-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8765/ >/dev/null
          node scripts/browser_smoke.mjs

      - name: Notify IndexNow participants about changed indexable URLs
        if: github.event_name == 'push' && success()
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_SHA: ${{ github.sha }}
        run: python scripts/notify_indexnow.py
