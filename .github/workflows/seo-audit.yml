name: SEO audit

on:
  push:
    branches: [main]
    paths:
      - "**/*.html"
      - "**/*.js"
      - "**/*.mjs"
      - "**/*.css"
      - "**/*.svg"
      - "**/*.webmanifest"
      - "sitemap.xml"
      - "robots.txt"
      - "scripts/**"
      - ".github/workflows/seo-audit.yml"
  pull_request:
    branches: [main]
    paths:
      - "**/*.html"
      - "**/*.js"
      - "**/*.mjs"
      - "**/*.css"
      - "**/*.svg"
      - "**/*.webmanifest"
      - "sitemap.xml"
      - "robots.txt"
      - "scripts/**"
      - ".github/workflows/seo-audit.yml"

permissions:
  contents: read

jobs:
  seo-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate SEO, metadata, links and sitemap
        run: python scripts/seo_audit.py
      - name: Verify the 1000-tool workshop inventory
        run: python scripts/check_workshop.py
      - name: Parse local converter engine
        run: node --check tools-audit/workshop/converters.js
      - name: Parse smart search engine
        run: node --check tools-audit/search.js
      - name: Validate Drive Horizon runtime and vehicle
        run: node scripts/check_drive_game.mjs
      - name: Parse inline JavaScript
        run: node scripts/check_inline_js.mjs
      - name: Check local browser utilities bundle
        run: node --check tools-audit/web-tools.js
