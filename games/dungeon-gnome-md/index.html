<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dungeon Gnome — The Goblin Hold</title><style>
*{box-sizing:border-box}body{margin:0;background:#100e1b;color:#f5e9c8;font:16px system-ui;display:grid;place-items:center;min-height:100vh;padding:16px}main{width:min(900px,100%);text-align:center}h1{color:#f4c96c;text-shadow:0 3px #763d2f;margin:0}canvas{width:100%;height:auto;image-rendering:pixelated;background:#080810;border:6px solid #8e663f;border-radius:8px;box-shadow:0 20px 60px #000}p{color:#d7c9aa}.buttons{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.buttons button{padding:12px 16px;background:#39283c;color:#ffe8b5;border:1px solid #9a704b;border-radius:8px;font-weight:bold}small{color:#ab9b7d}
</style><main><h1>⚒ DUNGEON GNOME ⚒</h1><p>THE GOBLIN HOLD · 16-BIT ROGUELIKE</p><canvas id="c" width="640" height="448"></canvas><p id="info">Найди три руны, открой ворота и не дай гоблинам сделать из тебя паштет.</p><div class="buttons"><button data-k="ArrowUp">▲</button><button data-k="ArrowLeft">◀</button><button data-k="ArrowDown">▼</button><button data-k="ArrowRight">▶</button><button data-k="Space">A · Удар</button><button data-k="KeyX">B · Бомба</button><button data-k="KeyC">C · Зелье</button><button id="start">Новый забег</button></div><small>WASD / стрелки — ходьба · Space — удар · X — бомба · C — зелье · Enter — новый забег</small></main><script>
(()=>{const c=document.querySelector('#c'),x=c.getContext('2d'),info=document.querySelector('#info'),N=20,M=14,S=32;let map,p,en,items,runes,hp,bombs,potions,floor,mode='title',score=0,seed=12345;
const rand=n=>{seed^=seed<<13;seed^=seed>>>17;seed^=seed<<5;return (seed>>>0)%n},dirs=[[0,-1],[1,0],[0,1],[-1,0]];
function floorGen(){map=Array.from({length:M},(_,y)=>Array.from({length:N},(_,z)=>y===0||z===0||y===M-1||z===N-1||rand(100)<22?1:0));for(let y=1;y<M-1;y++)for(let z=1;z<N-1;z++)if(rand(100)<66)map[y][z]=0;p={x:1,y:1,dir:2};en=[];items=[];runes=0;for(let i=0;i<3;i++)items.push({x:3+rand(15),y:2+rand(10),t:'♦'});for(let i=0;i<4+floor;i++)en.push({x:5+rand(13),y:2+rand(10),hp:1});items.push({x:18,y:12,t:'🚪'});for(let i=0;i<12;i++)items.push({x:2+rand(16),y:2+rand(10),t:rand(3)?'●':'♥'});}
function start(){seed=(Date.now()>>>0)||123;floor=1;hp=5;bombs=2;potions=1;score=0;floorGen();mode='play';msg('Этаж 1. Гном вооружён и слегка недоволен.');draw()}
let msg=t=>info.textContent=t;
function wall(a,b){return a<0||b<0||a>=N||b>=M||map[b][a]===1}
function hit(){let [dx,dy]=dirs[p.dir],e=en.find(e=>e.hp>0&&e.x===p.x+dx&&e.y===p.y+dy);if(e){e.hp=0;score+=75;msg('Гоблин побеждён! Он требовал адвоката.');}else msg('ВЖУХ! Воздух побеждён.');}
function step(dx,dy){if(mode!=='play')return;p.dir=dirs.findIndex(d=>d[0]===dx&&d[1]===dy);if(p.dir<0)p.dir=2;let a=p.x+dx,b=p.y+dy;if(wall(a,b))return;if(a===18&&b===12){if(runes<3){msg('Нужны три руны. Дверь бюрократична.');return}floor++;if(floor>4){mode='win';msg('ПОБЕДА! Гном вышел. Гоблины подали жалобу.');draw();return}floorGen();msg('Следующий этаж!');draw();return}p.x=a;p.y=b;let it=items.find(o=>o.x===a&&o.y===b&&o.t!=='🚪');if(it){if(it.t==='♦'){runes++;score+=100;msg('Руна найдена!')}else if(it.t==='♥')hp=Math.min(7,hp+1);else score+=20;items=items.filter(o=>o!==it)}for(let e of en){if(e.hp<=0)continue;let d=dirs.map(([vx,vy])=>[e.x+vx,e.y+vy]).filter(([a,b])=>!wall(a,b)).sort((u,v)=>(Math.abs(u[0]-p.x)+Math.abs(u[1]-p.y))-(Math.abs(v[0]-p.x)+Math.abs(v[1]-p.y)))[0];if(d){if(d[0]===p.x&&d[1]===p.y)hp--;else{e.x=d[0];e.y=d[1]}}}if(hp<=0){mode='dead';msg('Гнома поймали. Попробуем ещё раз?')}draw()}
function draw(){x.fillStyle='#090914';x.fillRect(0,0,640,448);for(let y=0;y<M;y++)for(let a=0;a<N;a++){x.fillStyle=map[y][a]?'#393348':(a+y)%3?'#242238':'#29243b';x.fillRect(a*S,y*S,S-1,S-1);if(map[y][a]){x.fillStyle='#62566a';x.fillRect(a*S+4,y*S+5,5,3)}}for(let o of items){x.font='24px serif';x.fillText(o.t,o.x*S+4,o.y*S+26)}for(let e of en)if(e.hp>0){x.font='25px serif';x.fillText('👺',e.x*S+2,e.y*S+26)}x.font='28px serif';x.fillText('🧔',p.x*S+1,p.y*S+27);x.fillStyle='#f6d88c';x.font='bold 16px monospace';x.fillText('FLOOR '+floor+'   HP '+hp+'   RUNES '+runes+'/3   BOMBS '+bombs+'   POTIONS '+potions+'   SCORE '+score,10,18);if(mode==='title'||mode==='dead'||mode==='win'){x.fillStyle='#000b';x.fillRect(50,145,540,150);x.fillStyle='#ffdc8c';x.font='bold 28px monospace';x.fillText(mode==='win'?'YOU ESCAPED!':mode==='dead'?'GNOME DOWN':'PRESS ENTER TO START',90,205);x.font='16px monospace';x.fillText('Goblin prison awaits...',185,240)}}
function act(k){if(k==='Space'){hit();draw()}else if(k==='KeyX'&&mode==='play'){if(bombs){bombs--;en.forEach(e=>{if(Math.abs(e.x-p.x)<=1&&Math.abs(e.y-p.y)<=1)e.hp=0});msg('БОМБА! Гоблины пересматривают карьеру.')}draw()}else if(k==='KeyC'&&mode==='play'){if(potions&&hp<7){potions--;hp=Math.min(7,hp+2);msg('Зелье выпито. Вкус — грибной налог.')}draw()}else if(k==='Enter')start();else if(k.startsWith('Arrow')||k.startsWith('KeyW')||k.startsWith('KeyA')||k.startsWith('KeyS')||k.startsWith('KeyD')){let d=k==='ArrowUp'||k==='KeyW'?[0,-1]:k==='ArrowDown'||k==='KeyS'?[0,1]:k==='ArrowLeft'||k==='KeyA'?[-1,0]:[1,0];step(...d)}}
addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();act(e.code)});document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>act(b.dataset.k));document.querySelector('#start').onclick=start;floor=1;floorGen();mode='title';draw()})();
</script></html>
