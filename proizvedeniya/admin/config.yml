backend:
  name: turbo-github
  turbo_site_id: REPLACE_WITH_DECAP_TURBO_SITE_UUID
  branch: main

locale: ru
media_folder: "proizvedeniya/media"
public_folder: "/proizvedeniya/media"
publish_mode: simple
slug:
  encoding: unicode
  clean_accents: true
  sanitize_replacement: "-"

collections:
  - name: author_works
    label: "Авторские произведения"
    label_singular: "Произведение"
    folder: "proizvedeniya/content/works"
    create: true
    delete: true
    extension: json
    format: json
    slug: "{{slug}}"
    summary: "{{title}} — {{date}}"
    sortable_fields: ["date", "title", "category"]
    fields:
      - { label: "Название", name: "title", widget: "string" }
      - { label: "Дата публикации", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "DD.MM.YYYY", time_format: false }
      - { label: "Жанр", name: "category", widget: "select", options: ["Философская лирика", "Лирика", "Поэзия", "Проза", "Рассказ", "Повесть", "Эссе", "Научный текст", "Другое"] }
      - { label: "Краткое описание", name: "excerpt", widget: "text", required: false }
      - { label: "Полный текст", name: "body", widget: "text", required: true }
      - { label: "Ссылка на первоначальную публикацию", name: "source_url", widget: "string", required: false }
      - { label: "Теги", name: "tags", widget: "list", required: false }
      - { label: "Избранное", name: "featured", widget: "boolean", default: false }
      - { label: "Происхождение", name: "origin", widget: "hidden", default: "Авторский текст" }

  - name: ai_works
    label: "ИИ-произведения"
    label_singular: "ИИ-произведение"
    folder: "ii-proizvedeniya/content/works"
    create: true
    delete: true
    extension: json
    format: json
    slug: "{{slug}}"
    summary: "{{title}} — {{date}}"
    sortable_fields: ["date", "title", "category"]
    fields:
      - { label: "Название", name: "title", widget: "string" }
      - { label: "Дата публикации", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "DD.MM.YYYY", time_format: false }
      - { label: "Направление", name: "category", widget: "select", options: ["Поэзия", "Проза", "Фантастика", "Философия", "Эксперимент", "Другое"] }
      - { label: "Происхождение", name: "origin", widget: "select", options: ["Создано ИИ", "Совместная работа человека и ИИ", "Авторская редакция ИИ-черновика"] }
      - { label: "Модель или система", name: "model", widget: "string", required: false }
      - { label: "Краткое описание", name: "excerpt", widget: "text", required: false }
      - { label: "Полный текст", name: "body", widget: "text", required: true }
      - { label: "Примечание об участии человека", name: "human_note", widget: "text", required: false }
      - { label: "Теги", name: "tags", widget: "list", required: false }
      - { label: "Избранное", name: "featured", widget: "boolean", default: false }
